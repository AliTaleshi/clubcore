spring:
  application:
    name: clubcore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clubcore}
    username: ${DB_USER:clubcore}
    password: ${DB_PASSWORD:clubcore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Tehran
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info

springdoc:
  swagger-ui.path: /api/docs
  api-docs.path: /api/docs/openapi.json

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  zone: Asia/Tehran
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  qr:
    ttl-seconds: 60
  bootstrap:
    admin-phone: ${ADMIN_PHONE:09120000000}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    admin-name: ${ADMIN_NAME:مدیر سیستم}
    seed-demo: ${SEED_DEMO:false}
  payment:
    zarinpal:
      merchant-id: ${ZARINPAL_MERCHANT_ID:00000000-0000-0000-0000-000000000000}
      sandbox: ${ZARINPAL_SANDBOX:true}
    zibal:
      merchant: ${ZIBAL_MERCHANT:zibal}
  sms:
    provider: ${SMS_PROVIDER:mock}
    kavenegar-api-key: ${KAVENEGAR_API_KEY:}
    kavenegar-sender: ${KAVENEGAR_SENDER:}
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5}
    max-tokens: ${AI_MAX_TOKENS:4000}
